# Configuração do Mosquitto 2 — projeto-iot-lucasg

# Sem listener explícito, o Mosquitto 2 só aceita conexões de dentro do container
listener 1883 0.0.0.0

# Segurança
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistência e logs (montados em volumes)
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_timestamp true
